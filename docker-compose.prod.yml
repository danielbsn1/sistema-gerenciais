services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: sistema-gerenciais:prod
    restart: unless-stopped
    working_dir: /var/www
    environment:
      - APP_ENV=production
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sistema_gerenciais
      MYSQL_USER: sistema
      MYSQL_PASSWORD: TROQUE_POR_UMA_SENHA_FORTE
      MYSQL_ROOT_PASSWORD: TROQUE_POR_OUTRA_SENHA_FORTE
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data:
